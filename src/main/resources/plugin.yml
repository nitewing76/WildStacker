name: WildStacker
version: 26.3.0-STANDALONE
main: com.bgsoftware.wildstacker.WildStackerPlugin
description: Standalone PurpurMC 26.3 Item, Spawner, and Barrel Stacker
author: Ome_R
api-version: '26.3'

depend:
  - CMI

softdepend:
  - EpicHoppers

commands:
  stacker:
    description: Main command for WildStacker.
    aliases: [ws, wildstacker]

permissions:
  wildstacker.*:
    description: Gives access to all WildStacker permissions.
    default: op
    children:
      wildstacker.give: true
      wildstacker.info: true
      wildstacker.reload: true
      wildstacker.save: true
      wildstacker.settings: true
      wildstacker.stats: true
      wildstacker.place.*: true
      wildstacker.nextplace.*: true
      wildstacker.silktouch: true
      wildstacker.nosilkdrop: true
      wildstacker.eggchange: true
      wildstacker.placebarrel: true
